# Intestazioni di sicurezza delle pagine del front-end. Il file è incluso in ogni
# location delle pagine: in nginx un add_header dentro una location fa perdere
# quelli scritti più in alto. Le risposte del gateway non le ricevono.

# Content-Security-Policy: script, stili, font e immagini solo da questa origine,
# e richieste (fetch, WebSocket) solo verso questa origine. Se qualcuno riuscisse
# a inserire HTML nella pagina, uno <script> esterno o scritto nella pagina non
# partirebbe. L'app non ha script né <style> in linea, quindi niente
# 'unsafe-inline'. frame-ancestors 'none': la pagina non si apre dentro un
# <iframe> di un altro sito (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Il browser non "indovina" il tipo dei file: un testo non diventa uno script
add_header X-Content-Type-Options "nosniff" always;

# Verso altri siti parte solo l'origine (http://localhost), non il path completo
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
