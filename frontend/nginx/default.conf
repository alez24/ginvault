# =============================================================================
# nginx del front-end di GinVault.
#
# Serve la build di Vite (dist/). Con Docker Compose fa anche da proxy verso il
# gateway per API, identità, login e logout: così il browser vede UNA sola
# origine (http://localhost) e i cookie SESSION e XSRF-TOKEN funzionano senza
# CORS. È lo stesso lavoro del proxy di Vite in sviluppo (vite.config.ts).
#
# Su Kubernetes quei path non arrivano mai qui: l'Ingress li manda direttamente
# al gateway (k8s/ingress.yaml) e a nginx arrivano solo le pagine.
# =============================================================================

# WebSocket (avvisi di Notifiche su /api/notifiche): "Connection: upgrade" solo
# se il browser chiede l'upgrade, altrimenti una normale richiesta HTTP
map $http_upgrade $connessione {
    default upgrade;
    ''      close;
}

server {
    # Immagine "unprivileged": nginx non è root, quindi non può usare la porta 80
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Niente versione di nginx nell'header Server e nelle pagine di errore
    server_tokens off;

    # Compressione dei file di testo (JavaScript, CSS, SVG)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ---- l'app React ---------------------------------------------------------
    # Le pagine sono route di React Router (/soci, /distilleria/edizioni/...):
    # per ogni indirizzo che non è un file nginx risponde con index.html, e la
    # pagina giusta la sceglie l'app nel browser.
    # index.html non va in cache: dopo un aggiornamento il browser deve trovare
    # subito i nomi dei file nuovi.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/ginvault/intestazioni.conf;
        add_header Cache-Control "no-cache" always;
    }

    # I file prodotti da Vite hanno nel nome l'impronta del contenuto
    # (index-CbeMtITL.js): un file con quel nome non cambia mai, quindi resta in
    # cache per un anno. Un file che non c'è è un 404, non index.html.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/ginvault/intestazioni.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- il gateway (Docker Compose) ------------------------------------------
    # /api/..., /auth/me, /oauth2/authorization/..., /login, /login/oauth2/code/...
    # e /logout: gli stessi path del proxy di Vite e delle regole dell'Ingress.
    location ~ ^/(api|auth|oauth2)/|^/(login|logout)(/|$) {
        proxy_pass http://gateway:8080;

        # L'Host del browser (localhost): il gateway lo usa per il redirect_uri
        # OAuth, http://localhost/login/oauth2/code/github, quello registrato
        # su Google e GitHub. Gli altri X-Forwarded-* li aggiunge il gateway.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connessione;
    }
}
