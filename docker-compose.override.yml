# =============================================================================
# GinVault - override SOLO PER LO SVILUPPO
#
# Docker Compose carica questo file AUTOMATICAMENTE insieme a docker-compose.yml
# quando si lancia "docker compose up" senza -f: le chiavi definite qui vengono
# unite a quelle del file principale (le liste come "ports" si sommano).
#
#   Sviluppo:         docker compose up -d --build --wait
#   Production mode:  docker compose -f docker-compose.yml up -d --build --wait
#                     (con -f esplicito questo file NON viene letto: è la
#                      modalità da usare per la demo d'esame)
#
# Cosa aggiunge: le porte dei database sul portatile, per collegarsi con
# IntelliJ (Database tool) o per avviare un servizio da IntelliJ: i default
# di DB_PORT nei vari application.yml puntano proprio a queste porte.
#
# "127.0.0.1:5441:5432" = HOST_IP:HOST_PORTA:CONTAINER_PORTA
#   - 127.0.0.1: la porta è aperta solo su questo computer, non sulla rete Wi-Fi
#   - 5441..5445 invece di 5432: non si scontrano con un eventuale Postgres
#     installato sul portatile, e ricordano le porte dei servizi (8081..8085)
# =============================================================================

services:
  edizioni-db:
    ports:
      - "127.0.0.1:5441:5432"

  ricette-db:
    ports:
      - "127.0.0.1:5442:5432"

  produzione-db:
    ports:
      - "127.0.0.1:5443:5432"

  magazzino-db:
    ports:
      - "127.0.0.1:5444:5432"

  pagamenti-db:
    ports:
      - "127.0.0.1:5445:5432"
