# Configurazione del microservizio Edizioni.
#
# Sintassi ${VARIABILE:default}: Spring usa la variabile d'ambiente se esiste,
# altrimenti il valore dopo i due punti.
#   - avvio da IntelliJ -> valgono i default (DB esposto da docker-compose.override.yml
#     su localhost:5441, gateway su localhost:8080)
#   - avvio con Docker Compose -> le variabili in docker-compose.yml puntano ai
#     container (edizioni-db:5432, gateway:8080, kafka:9092)

spring:
  application:
    # Nome logico del servizio: compare nei log (e in futuro in tracing/metriche)
    name: edizioni

  datasource:
    # Database PRIVATO di questo servizio: nessun altro servizio lo usa
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5441}/${DB_NAME:edizioni}
    username: ${DB_USER:edizioni}
    password: ${DB_PASSWORD:edizioni}

  jpa:
    hibernate:
      # Hibernate crea/aggiorna le tabelle partendo dalle @Entity.
      # Comodo in sviluppo; quando ci saranno le entità valuteremo Flyway.
      ddl-auto: update
    # Disattiva l'"Open Session in View": la sessione JPA non resta aperta
    # durante tutta la richiesta HTTP (evita query nascoste nei controller)
    open-in-view: false
    properties:
      # Elenco delle edizioni: le quote si caricano a blocchi di 50 edizioni
      # invece che con una query per edizione (il problema "N+1").
      hibernate.default_batch_fetch_size: 50

  # Kafka: per ora solo per PUBBLICARE (EdizioneCreata su edizioni.eventi),
  # dalla tabella outbox come in Magazzino: se Kafka è giù l'edizione si crea
  # lo stesso e l'evento aspetta nella tabella (PubblicatoreOutbox).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      client-id: edizioni
      # Chiave e valore come testo: il valore è il JSON della busta, già scritto
      # dall'outbox (nessun header __TypeId__, docs/eventi.md)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Con Kafka giù il publisher rinuncia dopo pochi secondi e riprova al giro dopo
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 4000
        # Dopo un riavvio di kafka-0 (IP nuovo) non aspettare 30 s sul vecchio indirizzo
        socket.connection.setup.timeout.ms: 1000
        socket.connection.setup.timeout.max.ms: 5000

  security:
    oauth2:
      resourceserver:
        jwt:
          # Dove scaricare le chiavi PUBBLICHE del gateway (JWKS). Il servizio le
          # scarica al primo token, le tiene in cache e le riscarica solo se arriva
          # un token firmato con una chiave ("kid") che non conosce.
          jwk-set-uri: ${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
          # Valore atteso del claim "iss": token di altri emittenti -> 401.
          # Con jwk-set-uri presente Spring non contatta questo indirizzo: lo usa
          # solo per il confronto (per questo può essere un nome e non un URL).
          issuer-uri: ${JWT_ISSUER:ginvault-gateway}
          # Il claim "roles" diventa le authority di Spring Security con prefisso
          # ROLE_: ["SOCIO"] -> ROLE_SOCIO -> @PreAuthorize("hasRole('SOCIO')")
          authorities-claim-name: roles
          authority-prefix: ROLE_

server:
  # Porta fissa per servizio (8081 = edizioni), uguale in locale e in Docker
  port: 8081
  # Il gateway toglie /api/edizioni dal path (StripPrefix) e lo dice con
  # X-Forwarded-Prefix, insieme a X-Forwarded-Host/Proto/Port. Con "framework"
  # Spring li applica alla richiesta, quindi i link costruiti qui (il Location
  # del 201) puntano all'indirizzo pubblico, es.
  # http://localhost/api/edizioni/... e non http://edizioni:8081/...
  # Ci si può fidare perché il servizio si raggiunge solo dalla rete interna
  # (il gateway, che accetta X-Forwarded-* solo da proxy fidati).
  forward-headers-strategy: framework

# Chiamata diretta a Ricette (sulla rete interna, NON passa dal gateway) per
# validare la formulazione quando si crea un'edizione: vedi CatalogoRicetteRest.
ricette:
  # In Compose e su Kubernetes la variabile punta al servizio: http://ricette:8082
  url: ${RICETTE_URI:http://localhost:8082}
  # Sia per aprire la connessione sia per aspettare la risposta: oltre -> 503.
  # Il circuit breaker vero arriverà con Istio (configurazione della mesh).
  timeout: 2s

edizioni:
  outbox:
    # Ogni quanti millisecondi il publisher guarda se ci sono eventi da mandare
    intervallo-ms: 1000
    # Quanti eventi al massimo per giro
    lotto: 50
    # Quanto aspettare la conferma di Kafka per un evento, oltre -> nuovo tentativo
    attesa-conferma: 5s

logging:
  level:
    # Il WARN di PubblicatoreOutbox basta (al primo tentativo fallito, poi ogni
    # 30): senza questa riga Spring Kafka scriverebbe un ERROR a ogni invio fallito
    org.springframework.kafka.support.LoggingProducerListener: off

management:
  endpoints:
    web:
      # Gli endpoint Actuator stanno alla radice: /health invece di /actuator/health
      base-path: /
      exposure:
        # Esponiamo via HTTP solo l'health check
        include: health
  endpoint:
    health:
      # when-authorized: da fuori /health risponde solo {"status":"UP"/"DOWN"};
      # i dettagli (es. "db": UP) solo a chi presenta un JWT con ruolo ADMIN.
      show-details: when-authorized
      roles: ADMIN
