# =============================================================================
# edizioni: il microservizio Spring Boot Edizioni.
#
# Tre oggetti:
#   1) ConfigMap   -> configurazione NON segreta (indirizzi, nomi), come variabili
#   2) Deployment  -> il pod con il container ginvault/edizioni:0.5
#   3) Service     -> nome DNS stabile "edizioni" (lo usa il gateway)
#
# Le stesse variabili d'ambiente che docker-compose.yml passa al container:
# application.yml non cambia, cambia solo CHI fornisce i valori.
# =============================================================================

# -----------------------------------------------------------------------------
# 1) ConfigMap: coppie chiave/valore in chiaro. Come un Secret, ma per dati non
#    riservati. Separare la configurazione dall'immagine permette di usare la
#    STESSA immagine in ambienti diversi (Compose, Minikube, un cluster vero).
#    Anche qui, i pod leggono i valori solo all'avvio: dopo una modifica serve
#    kubectl rollout restart deployment/edizioni -n ginvault
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: edizioni-config
  labels:
    app.kubernetes.io/name: edizioni
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
data:
  # Database: il nome del Service di edizioni-db (DNS interno del cluster)
  DB_HOST: edizioni-db
  DB_PORT: "5432"            # tra virgolette: i valori di una ConfigMap sono stringhe
  DB_NAME: edizioni
  # Chiavi pubbliche del gateway per verificare i JWT: il nome del Service "gateway"
  JWKS_URI: http://gateway:8080/.well-known/jwks.json
  # Edizioni chiama Ricette direttamente (Service "ricette", senza gateway) per
  # validare la formulazione quando si crea un'edizione
  RICETTE_URI: http://ricette:8082
  # Pubblica EdizioneCreata su edizioni.eventi dalla tabella outbox: il Service
  # headless di Kafka (kafka.yaml). Kafka non è nella readiness: con Kafka giù
  # le edizioni si creano lo stesso e l'evento aspetta nell'outbox.
  KAFKA_BOOTSTRAP: kafka:9092
  # Endpoint per le probe di Kubernetes: /health/liveness e /health/readiness.
  # Spring Boot li attiva da solo quando si accorge di girare su Kubernetes;
  # qui lo diciamo esplicitamente.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # readiness = "posso ricevere traffico?": senza database no, quindi includiamo
  # il controllo "db". La liveness invece NON lo include: se cade il database,
  # riavviare edizioni non servirebbe a nulla.
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db

---
# -----------------------------------------------------------------------------
# 2) Deployment. Edizioni non ha stato in memoria (niente sessioni: ogni
#    richiesta porta il suo JWT), quindi si potrebbe scalare a più repliche:
#        kubectl scale deployment/edizioni -n ginvault --replicas=2
#    e il Service distribuirebbe le richieste tra i pod.
#
#    Strategia di aggiornamento: RollingUpdate (default). Con 1 replica prima
#    parte il pod nuovo, e il vecchio viene spento solo quando il nuovo è Ready:
#    aggiornamento senza interruzione.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edizioni
  labels:
    app.kubernetes.io/name: edizioni
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edizioni
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edizioni
        app.kubernetes.io/component: microservizio
        app.kubernetes.io/part-of: ginvault
        # Pubblica e consuma eventi: la NetworkPolicy di Kafka lo fa entrare
        # (networkpolicy-kafka.yaml), come la rete kafka-net di Compose
        ginvault/usa-kafka: "true"
    spec:
      enableServiceLinks: false   # vedi edizioni-db.yaml
      containers:
        - name: edizioni
          # Immagine costruita DENTRO Minikube (minikube image build):
          # Never = non cercarla mai su un registry. Se manca: ErrImageNeverPull
          # 0.2 = storia di Marco: edizioni, tiratura, chiamata a Ricette
          # 0.5 = storia di Elena: consuma ResaRicalcolata, pubblica TiraturaRidotta,
          #       TiraturaAumentata e RicalcoloRifiutato
          image: ginvault/edizioni:0.5
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          # Tutte le chiavi della ConfigMap diventano variabili d'ambiente
          envFrom:
            - configMapRef:
                name: edizioni-config
          env:
            # Credenziali dal Secret condiviso con Postgres: una sola fonte
            # di verità, nessuna password scritta qui
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: edizioni-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edizioni-db
                  key: POSTGRES_PASSWORD
            # La JVM dimensiona l'heap in base al limite di memoria del
            # container: di default usa il 25%, qui il 50% (384 MiB su 768).
            # Il resto serve a metaspace, thread, buffer di rete.
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=50

          # --- Probe HTTP (risposta 200-399 = successo) ------------------------
          # startupProbe: fino a 40 x 3s = 2 minuti per avviare Spring Boot.
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 40
          # readinessProbe: se il DB non risponde, il pod esce dal Service.
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # livenessProbe: l'applicazione è bloccata? Allora riavviala.
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi

---
# -----------------------------------------------------------------------------
# 3) Service: il gateway raggiunge edizioni come http://edizioni:8081
#    (EDIZIONI_URI nella ConfigMap del gateway). ClusterIP: dall'esterno del
#    cluster si passa SOLO dal gateway, come in Compose.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: edizioni
  labels:
    app.kubernetes.io/name: edizioni
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edizioni
  ports:
    - name: http
      port: 8081
      targetPort: http
