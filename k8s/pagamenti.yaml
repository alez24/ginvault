# =============================================================================
# pagamenti: il microservizio Spring Boot Pagamenti (addebiti e rimborsi con
# Stripe in modalità test, per la SAGA della prenotazione di Edizioni).
#
# Stessi tre oggetti di edizioni.yaml (lì sono spiegati in dettaglio):
#   1) ConfigMap   -> configurazione non segreta, come variabili d'ambiente
#   2) Deployment  -> il pod con il container ginvault/pagamenti:0.1
#   3) Service     -> nome DNS stabile "pagamenti" (:8085, PAGAMENTI_URI in gateway.yaml)
#
# Legge i comandi RichiestaPagamento e RichiestaRimborso da pagamenti.comandi
# (consumer group "pagamenti"), chiama Stripe e pubblica gli esiti su
# pagamenti.esiti dalla tabella outbox; gli scarti vanno in pagamenti.dlt
# (docs/eventi.md).
#
# La chiave segreta di Stripe (sk_test_...) arriva dal Secret "pagamenti-stripe",
# che crea k8s/crea-secret.ps1 dalla riga STRIPE_SECRET_KEY del .env. Un Secret
# a parte, con quella chiave sola: il pod di pagamenti non vede i segreti OAuth
# del gateway.
#
# Pagamenti chiama https://api.stripe.com su Internet: le NetworkPolicy di
# GinVault filtrano solo il traffico in ENTRATA, l'uscita resta libera.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: pagamenti-config
  labels:
    app.kubernetes.io/name: pagamenti
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
data:
  DB_HOST: pagamenti-db
  DB_PORT: "5432"
  DB_NAME: pagamenti
  JWKS_URI: http://gateway:8080/.well-known/jwks.json
  # Il Service headless di Kafka (kafka.yaml)
  KAFKA_BOOTSTRAP: kafka:9092
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # Senza database Pagamenti non può lavorare: la readiness include "db".
  # Kafka e Stripe NO: con Kafka giù gli esiti aspettano nell'outbox, con
  # Stripe giù i comandi si riprovano e poi vanno in pagamenti.dlt.
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamenti
  labels:
    app.kubernetes.io/name: pagamenti
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pagamenti
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pagamenti
        # Verifica i JWT (/health con i dettagli per ADMIN): la NetworkPolicy
        # del gateway lo lascia scaricare la JWKS
        app.kubernetes.io/component: microservizio
        app.kubernetes.io/part-of: ginvault
        # Consuma comandi e pubblica esiti: la NetworkPolicy di Kafka lo fa
        # entrare (networkpolicy-kafka.yaml)
        ginvault/usa-kafka: "true"
    spec:
      enableServiceLinks: false
      containers:
        - name: pagamenti
          # Costruita dentro Minikube:
          #   minikube image build -t ginvault/pagamenti:0.1 .\pagamenti
          # 0.1 = storia di Giulia: addebiti e rimborsi con Stripe, outbox, DLT
          image: ginvault/pagamenti:0.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: pagamenti-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pagamenti-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pagamenti-db
                  key: POSTGRES_PASSWORD
            # Vuota: pagamenti parte lo stesso e lo dice nel log (WARN
            # "STRIPE_SECRET_KEY non impostata"); una chiave live (sk_live_)
            # fa fallire l'avvio. Il valore non compare mai nei log.
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pagamenti-stripe
                  key: STRIPE_SECRET_KEY
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=50
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: pagamenti
  labels:
    app.kubernetes.io/name: pagamenti
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pagamenti
  ports:
    - name: http
      port: 8085
      targetPort: http
