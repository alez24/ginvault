# =============================================================================
# produzione-db: il database PostgreSQL PRIVATO del servizio Produzione
# (piani di produzione, la tabella outbox e gli eventi già elaborati).
#
# Stessi tre oggetti di edizioni-db.yaml (lì sono spiegati in dettaglio):
#   1) PersistentVolumeClaim  -> il disco dei dati (1 GiB, StorageClass "standard")
#   2) Deployment             -> il pod di Postgres (strategia Recreate)
#   3) Service                -> il nome DNS stabile "produzione-db", solo interno
#
# Utente e password arrivano dal Secret "produzione-db" (k8s/crea-secret.ps1).
# Solo i pod di Produzione possono collegarsi: vedi networkpolicy-db.yaml.
# =============================================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: produzione-db-dati
  labels:
    app.kubernetes.io/name: produzione-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ginvault
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: produzione-db
  labels:
    app.kubernetes.io/name: produzione-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ginvault
spec:
  replicas: 1
  strategy:
    type: Recreate          # mai due Postgres sullo stesso volume
  selector:
    matchLabels:
      app.kubernetes.io/name: produzione-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: produzione-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ginvault
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: produzione
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: produzione-db       # POSTGRES_USER e POSTGRES_PASSWORD
          volumeMounts:
            - name: dati
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: dati
          persistentVolumeClaim:
            claimName: produzione-db-dati

---
apiVersion: v1
kind: Service
metadata:
  name: produzione-db
  labels:
    app.kubernetes.io/name: produzione-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ginvault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: produzione-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
