# =============================================================================
# ricette: il microservizio Spring Boot Ricette (formulazioni e prove di assaggio).
#
# Stessi tre oggetti di edizioni.yaml (lì sono spiegati in dettaglio):
#   1) ConfigMap   -> configurazione non segreta, come variabili d'ambiente
#   2) Deployment  -> il pod con il container ginvault/ricette:0.2
#   3) Service     -> nome DNS stabile "ricette": lo usano il gateway
#                     (/api/ricette/**) ed Edizioni (validazione REST)
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ricette-config
  labels:
    app.kubernetes.io/name: ricette
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
data:
  DB_HOST: ricette-db
  DB_PORT: "5432"
  DB_NAME: ricette
  JWKS_URI: http://gateway:8080/.well-known/jwks.json
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # Senza database Ricette non può rispondere: la readiness include "db"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ricette
  labels:
    app.kubernetes.io/name: ricette
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
spec:
  # Due repliche: se una sbaglia o è lenta, il sidecar di chi chiama la esclude
  # (outlier detection) e riprova sull'altra (k8s/istio/circuit-breaker-ricette.yaml).
  # Ricette non ha stato in memoria né lavori pianificati: tutto è nel database
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ricette
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ricette
        app.kubernetes.io/component: microservizio
        app.kubernetes.io/part-of: ginvault
    spec:
      enableServiceLinks: false
      containers:
        - name: ricette
          # Costruita dentro Minikube: minikube image build -t ginvault/ricette:0.2 ricette
          image: ginvault/ricette:0.2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: ricette-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ricette-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ricette-db
                  key: POSTGRES_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=50
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi

---
# Service: http://ricette:8082 dentro il cluster (RICETTE_URI di gateway ed
# edizioni). Con "kubectl scale deployment/ricette --replicas=0" il Service
# resta ma non ha pod dietro. Con Istio il sidecar di chi chiama lo sa (gli
# endpoint glieli manda istiod) e risponde subito 503 "no healthy upstream";
# edizioni lo traduce nel suo 503 "Ricette non disponibile"
# (docs/demo-storia-marco.md). Senza Istio (Compose) le connessioni restano
# appese finché non scade il timeout di edizioni (2 s).
apiVersion: v1
kind: Service
metadata:
  name: ricette
  labels:
    app.kubernetes.io/name: ricette
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ricette
  ports:
    - name: http
      port: 8082
      targetPort: http
