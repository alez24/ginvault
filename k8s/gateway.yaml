# =============================================================================
# gateway: Spring Cloud Gateway, l'unico punto di ingresso dall'esterno.
#
# Tre oggetti:
#   1) ConfigMap   -> destinazioni delle route e impostazioni non segrete
#   2) Deployment  -> il pod con ginvault/gateway:0.1
#   3) Service     -> nome DNS "gateway": lo usano l'Ingress (verso il gateway)
#                     e i servizi (per scaricare le chiavi pubbliche JWKS)
#
# I segreti OAuth e gli elenchi dei ruoli arrivano dal Secret "gateway-segreti"
# (k8s/crea-secret.ps1, a partire dal .env).
# =============================================================================

# -----------------------------------------------------------------------------
# 1) ConfigMap
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ginvault
data:
  # Destinazioni delle route (gateway/application.yml): i nomi dei Service.
  # Per ora esistono "edizioni" e "ricette": le altre route rispondono con un
  # errore finché non aggiungiamo i relativi servizi, senza toccare il gateway.
  EDIZIONI_URI: http://edizioni:8081
  RICETTE_URI: http://ricette:8082
  PRODUZIONE_URI: http://produzione:8083
  MAGAZZINO_URI: http://magazzino:8084
  PAGAMENTI_URI: http://pagamenti:8085
  NOTIFICHE_URI: http://notifiche:8086
  # Endpoint /health/liveness e /health/readiness per le probe
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # Il gateway sta DIETRO l'Ingress: il browser parla con l'Ingress, che
  # inoltra al gateway aggiungendo gli header X-Forwarded-Host/Proto/Port.
  # Con "native" il gateway li usa per ricostruire l'indirizzo originale, che
  # serve a calcolare il redirect_uri OAuth (http://localhost/login/oauth2/code/...).
  SERVER_FORWARD_HEADERS_STRATEGY: native

---
# -----------------------------------------------------------------------------
# 2) Deployment.
#    UNA sola replica, per scelta: la sessione degli utenti e la chiave RSA che
#    firma i JWT stanno nella memoria del pod. Con due repliche un utente
#    loggato sul pod A risulterebbe sconosciuto al pod B. Per scalare servono
#    la sessione su Redis e la chiave in un Secret condiviso.
#    Per lo stesso motivo un riavvio (o un aggiornamento) del gateway fa
#    perdere le sessioni: bisogna rifare il login.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ginvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: ginvault
    spec:
      enableServiceLinks: false   # vedi edizioni-db.yaml
      containers:
        - name: gateway
          # 0.2 = CSRF con cookie XSRF-TOKEN e header X-Forwarded-* verso i servizi
          image: ginvault/gateway:0.2
          imagePullPolicy: Never   # immagine costruita dentro Minikube
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Configurazione in chiaro
            - configMapRef:
                name: gateway-config
            # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_ID,
            # GITHUB_CLIENT_SECRET, RUOLI_*: le stesse variabili di Compose.
            # Se il Secret non esiste il pod resta in CreateContainerConfigError.
            - secretRef:
                name: gateway-segreti
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=50   # vedi edizioni.yaml

          # Probe: stesse regole di edizioni. La readiness del gateway NON
          # dipende dai servizi a valle: se edizioni è giù, il gateway deve
          # continuare a servire login e le altre route.
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi

---
# -----------------------------------------------------------------------------
# 3) Service. Resta ClusterIP: dall'esterno il gateway si raggiunge solo
#    attraverso l'Ingress (passo successivo), non con una porta del nodo.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ginvault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
