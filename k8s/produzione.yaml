# =============================================================================
# produzione: il microservizio Spring Boot Produzione (piani di produzione
# delle edizioni, con la botanica di stagione che arriva davvero).
#
# Stessi tre oggetti di edizioni.yaml (lì sono spiegati in dettaglio):
#   1) ConfigMap   -> configurazione non segreta, come variabili d'ambiente
#   2) Deployment  -> il pod con il container ginvault/produzione:0.1
#   3) Service     -> nome DNS stabile "produzione": lo usa il gateway
#                     (/api/produzione/**, PRODUZIONE_URI in gateway.yaml)
#
# Consuma edizioni.eventi (EdizioneCreata -> nuovo piano) e magazzino.eventi
# (ConsegnaRegistrata -> resa ricalcolata) nel consumer group "produzione";
# pubblica ResaRicalcolata su produzione.eventi con la transactional outbox e
# i messaggi che non riesce a elaborare su produzione.dlt (docs/eventi.md).
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: produzione-config
  labels:
    app.kubernetes.io/name: produzione
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
data:
  DB_HOST: produzione-db
  DB_PORT: "5432"
  DB_NAME: produzione
  JWKS_URI: http://gateway:8080/.well-known/jwks.json
  # Il Service headless di Kafka (kafka.yaml)
  KAFKA_BOOTSTRAP: kafka:9092
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # Senza database Produzione non può rispondere: la readiness include "db".
  # Kafka invece NO: con Kafka giù i piani si leggono lo stesso, i consumer
  # si ricollegano da soli e ResaRicalcolata aspetta nell'outbox.
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: produzione
  labels:
    app.kubernetes.io/name: produzione
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: produzione
  template:
    metadata:
      labels:
        app.kubernetes.io/name: produzione
        # Verifica i JWT: la NetworkPolicy del gateway lo lascia scaricare la JWKS
        app.kubernetes.io/component: microservizio
        app.kubernetes.io/part-of: ginvault
        # Legge e pubblica eventi: la NetworkPolicy di Kafka lo fa entrare
        # (networkpolicy-kafka.yaml), come la rete kafka-net di Compose
        ginvault/usa-kafka: "true"
    spec:
      enableServiceLinks: false
      containers:
        - name: produzione
          # Costruita dentro Minikube: minikube image build -t ginvault/produzione:0.1 produzione
          image: ginvault/produzione:0.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: produzione-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: produzione-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: produzione-db
                  key: POSTGRES_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=50
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: produzione
  labels:
    app.kubernetes.io/name: produzione
    app.kubernetes.io/component: microservizio
    app.kubernetes.io/part-of: ginvault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: produzione
  ports:
    - name: http
      port: 8083
      targetPort: http
