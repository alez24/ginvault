# Configurazione del microservizio Magazzino.
#
# Sintassi ${VARIABILE:default}: Spring usa la variabile d'ambiente se esiste,
# altrimenti il valore dopo i due punti.
#   - avvio da IntelliJ -> valgono i default (DB esposto da docker-compose.override.yml
#     su localhost:5444, gateway su localhost:8080)
#   - avvio con Docker Compose -> le variabili in docker-compose.yml puntano ai
#     container (magazzino-db:5432, gateway:8080)

spring:
  application:
    # Nome logico del servizio: compare nei log (e in futuro in tracing/metriche)
    name: magazzino

  datasource:
    # Database PRIVATO di questo servizio: nessun altro servizio lo usa
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5444}/${DB_NAME:magazzino}
    username: ${DB_USER:magazzino}
    password: ${DB_PASSWORD:magazzino}

  jpa:
    hibernate:
      # Hibernate crea/aggiorna le tabelle partendo dalle @Entity.
      # Comodo in sviluppo; quando ci saranno le entità valuteremo Flyway.
      ddl-auto: update
    # Disattiva l'"Open Session in View": la sessione JPA non resta aperta
    # durante tutta la richiesta HTTP (evita query nascoste nei controller)
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Dove scaricare le chiavi PUBBLICHE del gateway (JWKS). Il servizio le
          # scarica al primo token, le tiene in cache e le riscarica solo se arriva
          # un token firmato con una chiave ("kid") che non conosce.
          jwk-set-uri: ${JWKS_URI:http://localhost:8080/.well-known/jwks.json}
          # Valore atteso del claim "iss": token di altri emittenti -> 401.
          # Con jwk-set-uri presente Spring non contatta questo indirizzo: lo usa
          # solo per il confronto (per questo può essere un nome e non un URL).
          issuer-uri: ${JWT_ISSUER:ginvault-gateway}
          # Il claim "roles" diventa le authority di Spring Security con prefisso
          # ROLE_: ["SOCIO"] -> ROLE_SOCIO -> @PreAuthorize("hasRole('SOCIO')")
          authorities-claim-name: roles
          authority-prefix: ROLE_

server:
  # Porta fissa per servizio (8084 = magazzino), uguale in locale e in Docker
  port: 8084

management:
  endpoints:
    web:
      # Gli endpoint Actuator stanno alla radice: /health invece di /actuator/health
      base-path: /
      exposure:
        # Esponiamo via HTTP solo l'health check
        include: health
  endpoint:
    health:
      # when-authorized: da fuori /health risponde solo {"status":"UP"/"DOWN"};
      # i dettagli (es. "db": UP) solo a chi presenta un JWT con ruolo ADMIN.
      show-details: when-authorized
      roles: ADMIN
